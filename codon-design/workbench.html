<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codon design workbench</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d8dde6;
      --text: #172033;
      --muted: #5f6b7a;
      --accent: #0f766e;
      --accent-2: #1d4ed8;
      --danger: #b91c1c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
    }
    header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }
    main {
      display: grid;
      grid-template-columns: minmax(330px, 430px) minmax(620px, 1fr);
      min-height: calc(100vh - 52px);
    }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfd;
      padding: 16px;
      overflow: auto;
    }
    section.workspace {
      padding: 16px;
      overflow: auto;
      min-width: 0;
    }
    .panel, .viewer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .panel h2, .viewer h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 650;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 5px;
      font-weight: 600;
    }
    textarea, input, select {
      width: 100%;
      border: 1px solid #c9d1dc;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: 13px var(--mono);
      padding: 8px 9px;
      outline: none;
    }
    textarea:focus, input:focus, select:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.12);
    }
    textarea {
      resize: vertical;
      min-height: 90px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row > * { flex: 1; }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .button-grid .primary-action { grid-column: 1 / -1; }
    .button-grid .full-row-action {
      grid-column: 1 / -1;
      justify-self: center;
      width: 100%;
    }
    button {
      border: 1px solid #0f5f59;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      font-weight: 650;
      padding: 9px 12px;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: #c9d1dc;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }
    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .status.error { color: var(--danger); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(96px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .metric {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 62px;
    }
    .metric .value {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .metric .label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 430px);
      gap: 14px;
      align-items: start;
    }
    .table-pane {
      min-width: 0;
      overflow-x: auto;
    }
    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid #e8ebf0;
      padding: 7px 8px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    th {
      background: #f0f3f7;
      color: #3a4656;
      font-size: 12px;
      font-weight: 650;
    }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    tr:hover td { background: #f7fafc; }
    tr.selected td { background: #eaf6f4; }
    td.sequence {
      max-width: 310px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--mono);
      text-align: left;
    }
    .svg-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .svg-box {
      border: 1px solid #e2e7ef;
      border-radius: 6px;
      min-height: 230px;
      overflow: auto;
      background: #fff;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    .svg-box .caption {
      color: var(--muted);
      font-size: 12px;
      height: 18px;
      line-height: 18px;
      margin-bottom: 8px;
      font-weight: 650;
    }
    .svg-box .caption sub { line-height: 0; }
    #structureSvg {
      flex: 1;
      min-height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .svg-box svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .svg-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      background: #f7f8fa;
      border-radius: 6px;
      padding: 18px;
      text-align: center;
    }
    .details {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: #263449;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f7f8fa;
      border: 1px solid #e2e7ef;
      border-radius: 6px;
      padding: 8px;
      max-height: 190px;
      overflow: auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #e8edf5;
      color: #3d4a5d;
      font-size: 12px;
      font-weight: 600;
    }
    .hidden { display: none !important; }
    @media (max-width: 1050px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--line); }
      .split { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Codon design workbench</h1>
    <span class="badge" id="deviceBadge">single-thread WASM</span>
  </header>
  <main>
    <aside>
      <div class="panel">
        <h2>Input</h2>
        <label for="psi">Amino-acid sequence</label>
        <textarea id="psi" spellcheck="false"></textarea>
      </div>
      <div class="panel">
        <h2>Sampling</h2>
        <div class="grid2">
          <div>
            <label for="rnaSamples">RNA samples</label>
            <input id="rnaSamples" type="number" min="1" value="2000" />
          </div>
          <div>
            <label for="topK">Top RNAs</label>
            <input id="topK" type="number" min="1" value="5" />
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="structureSamples">Structures / RNA</label>
            <input id="structureSamples" type="number" min="0" value="1000" />
          </div>
          <div>
            <label for="seed">Seed</label>
            <input id="seed" type="number" min="0" value="123" />
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="rankingMode">Ranking</label>
            <select id="rankingMode">
              <option value="auto">auto</option>
              <option value="exact">exact</option>
              <option value="fast">fast</option>
            </select>
          </div>
          <div>
            <label for="rankPool">Fast rank pool</label>
            <input id="rankPool" type="number" min="1" value="20" />
          </div>
        </div>
        <div class="button-grid">
          <button class="primary-action" id="designBtn">Design</button>
          <button class="secondary" id="exampleBtn">Example</button>
          <button class="secondary" id="clearBtn">Clear</button>
          <button class="secondary full-row-action" id="mainPageBtn">Tutorial view</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </aside>
    <section class="workspace">
      <div class="metrics" id="metrics"></div>
      <div class="split">
        <div class="table-pane">
          <table>
            <thead>
              <tr>
                <th>rank</th>
                <th>RNA</th>
                <th>score</th>
                <th>q<sub>ψ</sub>(φ)</th>
                <th>count</th>
                <th>structs</th>
                <th>best q<sub>ψ</sub>(φ,s)</th>
                <th>struct NLL</th>
                <th>GC</th>
              </tr>
            </thead>
            <tbody id="candidateRows"></tbody>
          </table>
        </div>
        <div class="viewer">
          <h2>Viewer</h2>
          <div class="svg-grid">
            <div class="svg-box">
              <div class="caption" id="viewerCaption">Lowest sampled q<sub>ψ</sub>(φ,s)</div>
              <div id="structureSvg" class="svg-placeholder">Run design, then select an RNA candidate.</div>
            </div>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="secondary" id="randomStructureBtn" disabled>Random sampled structure</button>
            <button class="secondary" id="bestStructureBtn" disabled>Best sampled structure</button>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="secondary" id="toggleViewBtn" disabled>Show AA view</button>
            <button class="secondary" id="copyRnaBtn" disabled>Copy RNA</button>
          </div>
          <div class="details" id="details"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="codon_design_run.js"></script>
  <script src="vienna_render.js"></script>
  <script src="workbench.js"></script>
</body>
</html>
